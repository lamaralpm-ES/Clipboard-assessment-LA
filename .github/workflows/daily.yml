name: Daily Bellhaven reconciliation

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python dry_run.py
        env:
          CANDIDATE_TOKEN: ${{ secrets.CANDIDATE_TOKEN }}
